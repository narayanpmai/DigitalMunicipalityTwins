<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Modern Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg-gradient)"/>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="physical-grad" x1="16" y1="20" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="digital-grad" x1="32" y1="12" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="20" y1="12" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Physical Municipal Architecture (Green / Sustainable) -->
  <!-- Municipal Building Block Left -->
  <path d="M32 14L16 23.5V40.5L32 50V32L32 14Z" fill="url(#physical-grad)" opacity="0.95"/>
  <path d="M24 28V36M20 30.5V38.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Right: Digital Twin Cyber Grid (Cyan / Electric Blue) -->
  <!-- Holographic Twin Block Right -->
  <path d="M32 14L48 23.5V40.5L32 50V32L32 14Z" fill="url(#digital-grad)" opacity="0.9"/>

  <!-- Digital Twin Grid / Circuit Overlays -->
  <path d="M32 14L48 23.5L32 32L16 23.5L32 14Z" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Digital Nodes & Connecting Beams -->
  <g filter="url(#glow)">
    <!-- Circuit lines on right digital twin -->
    <path d="M32 32L48 23.5M32 41L48 32.5M40 18.5V36.5" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round"/>
    
    <!-- Central Twin Sync Axis -->
    <line x1="32" y1="14" x2="32" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- IoT Sensor Nodes -->
    <circle cx="32" cy="14" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="48" cy="23.5" r="2.4" fill="#00f2fe"/>
    <circle cx="48" cy="40.5" r="2.4" fill="#38bdf8"/>
    <circle cx="32" cy="50" r="2.8" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="16" cy="40.5" r="2.4" fill="#34d399"/>
    <circle cx="16" cy="23.5" r="2.4" fill="#10b981"/>
    
    <!-- Central Pulse -->
    <circle cx="32" cy="32" r="3.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  </g>
</svg>