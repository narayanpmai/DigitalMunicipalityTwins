# Nginx Production Configuration for Municipal Digital Twins
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow municipal document uploads (up to 100MB)
    client_max_body_size 100M;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Gzip compression for faster loading across low-bandwidth rural networks
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    absolute_redirect off;
    port_in_redirect off;

    # ─── Super Admin Console (React SPA) ──────────────────────
    location ^~ /super-admin {
        try_files $uri $uri/ /super-admin.html;
    }

    # ─── Palika Admin & Modern Dashboard ─────────────────────
    # /admin → React SPA (app.html) — unified dashboard
    location = /admin.html {
        return 301 /dashboard;
    }

    location ^~ /admin {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /app.html;
    }

    location ^~ /app {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /app.html;
    }

    # ─── Administrative Dashboard Endpoints (React SPA) ───────
    location ^~ /dashboard {
        try_files $uri $uri/ /app.html;
    }

    # ─── Public 10-Year One Pager Report (Unauthenticated Public SPA) ─
    location ^~ /public-report {
        try_files $uri $uri/ /public-report.html /app.html;
    }

    location ^~ /one-pager {
        try_files $uri $uri/ /one-pager.html /public-report.html /app.html;
    }

    location ^~ /progress-reports {
        try_files $uri $uri/ /app.html;
    }

    location ^~ /open-data {
        try_files $uri $uri/ /app.html;
    }

    location ^~ /social-inclusion {
        try_files $uri $uri/ /app.html;
    }

    # ─── Clean Public Portal Aliases & SPA Pages ──────────────
    location = /assets {
        try_files /index.html =404;
    }

    location = /badapatra {
        try_files /index.html =404;
    }

    location = /citizen-services {
        try_files /index.html =404;
    }

    # ─── Login & Register Pages ───────────────────────────────
    location = /login {
        try_files /index.html =404;
    }

    location = /register {
        try_files /index.html =404;
    }

    # ─── AI Service TTS Proxy ─────────────────────────────────
    location /api/v1/tts/ {
        proxy_pass http://ai_service:8000/api/v1/tts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── AI Services (Chat, GIS buffer/risk, Analytics) Proxy ─────
    location /api/v1/chat/ {
        proxy_pass http://ai_service:8000/api/v1/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/gis/buffer-analysis {
        proxy_pass http://ai_service:8000/api/v1/gis/buffer-analysis;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/gis/risk-zoning {
        proxy_pass http://ai_service:8000/api/v1/gis/risk-zoning;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/analytics/crop-yield-forecast {
        proxy_pass http://ai_service:8000/api/v1/analytics/crop-yield-forecast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/analytics/revenue-forecast {
        proxy_pass http://ai_service:8000/api/v1/analytics/revenue-forecast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── API Proxy with Rate Limiting (Backend) ───────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── WebSocket / Socket.io Proxy (Backend) ────────────────
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Uploaded media proxy ─────────────────────────────────
    location ^~ /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Ensure unified-navbar.js and sw.js are never cached by browsers ──
    location = /unified-navbar.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ─── Cache static build assets ────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── General Static Pages & Clean URLs Fallback ───────────
    # Resolves: /path -> /path.html -> /path/ -> /index.html
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        try_files $uri $uri.html $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
